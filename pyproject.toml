[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "interval-flux-vacuum-5-81"
version = "1.0.2"
description = "Independent verifier for an all-orders interval flux-root certificate"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
authors = [
  {name = "Evgeniy Agafonov", email = "my@eagafonov.ru"}
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: BSD License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Mathematics"
]

[project.scripts]
verify-flux-certificate = "fluxcert.verify:main"

[tool.setuptools.packages.find]
where = ["src"]
